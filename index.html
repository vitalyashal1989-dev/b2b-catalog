<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B2B Каталог — Всё-Полотна.рф</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #667eea;
            --primary-dark: #764ba2;
            --secondary: #f093fb;
            --accent: #f5576c;
            --success: #4facfe;
            --warning: #ffa751;
            --bg-dark: #0f0c29;
            --bg-medium: #302b63;
            --bg-light: #24243e;
            --text-primary: #ffffff;
            --text-secondary: #b8b8d4;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-medium) 50%, var(--bg-light) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .header {
            background: rgba(15, 12, 41, 0.8);
            backdrop-filter: blur(10px);
            padding: 20px 30px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--card-border);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .logo-text h1 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-text p {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .search-container {
            flex: 1;
            max-width: 500px;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 12px 20px 12px 45px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 14px;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .search-box::before {
            content: '🔍';
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
        }

        .cart-btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--accent), var(--warning));
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cart-badge {
            background: white;
            color: var(--accent);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px;
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 30px;
        }

        .sidebar {
            position: sticky;
            top: 100px;
            height: fit-content;
        }

        .nav-section {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .nav-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .category-list {
            list-style: none;
        }

        .category-item {
            padding: 12px 16px;
            margin-bottom: 8px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
            transition: all 0.3s;
        }

        .category-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .category-item.active {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        }

        .category-name {
            font-size: 14px;
            font-weight: 500;
        }

        .category-count {
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
        }

        .breadcrumbs {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .breadcrumb-item {
            cursor: pointer;
        }

        .breadcrumb-item:hover {
            color: var(--primary);
        }

        .breadcrumb-separator {
            color: var(--text-secondary);
        }

        .breadcrumb-current {
            color: var(--text-primary);
            font-weight: 600;
        }

        .brand-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .brand-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 24px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
        }

        .brand-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
        }

        .brand-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 15px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 700;
            color: white;
        }

        .brand-name {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .brand-count {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
        }

        .product-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-info {
            padding: 20px;
        }

        .product-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
            gap: 10px;
        }

        .product-title {
            font-size: 15px;
            font-weight: 600;
            line-height: 1.4;
            flex: 1;
        }

        .product-code {
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
        }

        .product-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }

        .meta-tag {
            background: rgba(255, 255, 255, 0.08);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .product-prices {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 15px;
        }

        .price-main {
            font-size: 20px;
            font-weight: 700;
            color: var(--success);
        }

        .price-harpoon {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .product-actions {
            display: flex;
            gap: 10px;
        }

        .btn-add {
            flex: 1;
            padding: 12px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-link {
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            color: var(--text-primary);
            text-decoration: none;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loading {
            text-align: center;
            padding: 80px 20px;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid var(--card-border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .estimate-panel {
            position: fixed;
            top: 0;
            right: -450px;
            width: 420px;
            height: 100vh;
            background: var(--bg-dark);
            border-left: 1px solid var(--card-border);
            z-index: 1000;
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
            padding: 25px;
        }

        .estimate-panel.open {
            right: 0;
        }

        .estimate-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 15px;
        }

        .estimate-header h2 {
            font-size: 20px;
            font-weight: 700;
        }

        .btn-close-estimate {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 24px;
            cursor: pointer;
        }

        .estimate-items-container {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .estimate-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .estimate-item img {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            object-fit: cover;
        }

        .estimate-item-details {
            flex: 1;
        }

        .estimate-item-title {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .estimate-item-price {
            font-size: 14px;
            font-weight: 700;
            color: var(--success);
        }

        .btn-remove-item {
            background: none;
            border: none;
            color: var(--accent);
            cursor: pointer;
            font-size: 16px;
        }

        .estimate-footer {
            border-top: 1px solid var(--card-border);
            padding-top: 20px;
        }

        .estimate-summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .estimate-summary-price {
            font-size: 24px;
            font-weight: 700;
            color: var(--success);
        }

        .estimate-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-export, .btn-clear {
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-export {
            background: linear-gradient(135deg, var(--success), #00c6ff);
            color: white;
        }

        .btn-clear {
            background: rgba(255, 255, 255, 0.08);
            color: white;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            z-index: 990;
            display: none;
        }

        .overlay.open {
            display: block;
        }

        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
            }
            .sidebar {
                position: static;
            }
        }

        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 15px;
            }
            .search-container {
                max-width: 100%;
            }
            .estimate-panel {
                width: 100%;
                right: -100%;
            }
        }
    </style>
</head>
<body>
    <div class="overlay" id="overlay" onclick="toggleCart()"></div>

    <header class="header">
        <div class="header-content">
            <div class="logo" onclick="resetNavigation()">
                <div class="logo-icon">🏠</div>
                <div class="logo-text">
                    <h1>B2B Каталог</h1>
                    <p>Всё-Полотна.рф</p>
                </div>
            </div>

            <div class="search-container">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Поиск по названию, артикулу, бренду...">
                </div>
            </div>

            <button class="cart-btn" onclick="toggleCart()">
                🛒 Смета
                <span class="cart-badge" id="cartBadge">0</span>
            </button>
        </div>
    </header>

    <div class="container">
        <aside class="sidebar">
            <div class="nav-section">
                <div class="nav-title">Категории</div>
                <ul class="category-list" id="categoryList"></ul>
            </div>
        </aside>

        <main class="content">
            <div class="breadcrumbs" id="breadcrumbs">
                <span class="breadcrumb-current">Все категории</span>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Загрузка каталога...</p>
            </div>

            <div id="contentArea"></div>
        </main>
    </div>

    <div class="estimate-panel" id="estimatePanel">
        <div class="estimate-header">
            <h2>📋 Ваша смета</h2>
            <button class="btn-close-estimate" onclick="toggleCart()">✕</button>
        </div>
        <div class="estimate-items-container" id="estimateItems"></div>
        <div class="estimate-footer">
            <div class="estimate-summary-row">
                <span>Итого:</span>
                <span class="estimate-summary-price" id="totalPrice">0 ₽</span>
            </div>
            <div class="estimate-actions">
                <button class="btn-export" onclick="exportEstimate()">Экспорт CSV</button>
                <button class="btn-clear" onclick="clearEstimate()">Очистить</button>
            </div>
        </div>
    </div>

    <script>
        let products = [];
        let state = {
            currentCategory: null,
            currentBrand: null,
            cart: []
        };

        async function loadData() {
            try {
                const response = await fetch('catalog_data.json?t=' + Date.now());
                if (!response.ok) throw new Error('Не удалось загрузить каталог');

                products = await response.json();
                document.getElementById('loading').style.display = 'none';
                renderCategories();
                showBrands();
            } catch (error) {
                document.getElementById('loading').innerHTML = '<div style="text-align:center;padding:80px 20px;"><div style="font-size:80px;margin-bottom:20px;">⚠️</div><div style="font-size:24px;font-weight:600;margin-bottom:10px;">Ошибка загрузки</div><div style="color:#b8b8d4;font-size:16px;">' + error.message + '</div></div>';
            }
        }

        function renderCategories() {
            const categories = {};
            products.forEach(p => {
                const cat = p.category;
                categories[cat] = (categories[cat] || 0) + 1;
            });

            const list = document.getElementById('categoryList');
            list.innerHTML = Object.entries(categories)
                .sort((a, b) => b[1] - a[1])
                .map(([cat, count]) => '<li class="category-item" onclick="selectCategory(\'' + cat + '\')"><span class="category-name">' + cat + '</span><span class="category-count">' + count + '</span></li>')
                .join('');
        }

        function selectCategory(category) {
            state.currentCategory = category;
            state.currentBrand = null;

            document.querySelectorAll('.category-item').forEach(item => {
                item.classList.remove('active');
                if (item.querySelector('.category-name').textContent === category) {
                    item.classList.add('active');
                }
            });

            showBrands();
            updateBreadcrumbs();
        }

        function showBrands() {
            const filtered = state.currentCategory 
                ? products.filter(p => p.category === state.currentCategory)
                : products;

            const brands = {};
            filtered.forEach(p => {
                const brand = p.brand;
                brands[brand] = (brands[brand] || 0) + 1;
            });

            const content = document.getElementById('contentArea');

            if (Object.keys(brands).length === 0) {
                content.innerHTML = '<div style="text-align:center;padding:80px 20px;"><div style="font-size:80px;margin-bottom:20px;">📦</div><div style="font-size:24px;font-weight:600;margin-bottom:10px;">Нет товаров</div><div style="color:#b8b8d4;font-size:16px;">В этой категории пока нет товаров</div></div>';
                return;
            }

            content.innerHTML = '<div class="brand-grid">' + Object.entries(brands)
                .sort((a, b) => b[1] - a[1])
                .map(([brand, count]) => '<div class="brand-card" onclick="selectBrand(\'' + brand.replace(/'/g, "\\'") + '\')"><div class="brand-icon">' + brand.charAt(0) + '</div><div class="brand-name">' + brand + '</div><div class="brand-count">' + count + ' товаров</div></div>')
                .join('') + '</div>';
        }

        function selectBrand(brand) {
            state.currentBrand = brand;
            showProducts();
            updateBreadcrumbs();
        }

        function showProducts() {
            let filtered = products;

            if (state.currentCategory) {
                filtered = filtered.filter(p => p.category === state.currentCategory);
            }

            if (state.currentBrand) {
                filtered = filtered.filter(p => p.brand === state.currentBrand);
            }

            const content = document.getElementById('contentArea');

            if (filtered.length === 0) {
                content.innerHTML = '<div style="text-align:center;padding:80px 20px;"><div style="font-size:80px;margin-bottom:20px;">🔍</div><div style="font-size:24px;font-weight:600;margin-bottom:10px;">Товары не найдены</div><div style="color:#b8b8d4;font-size:16px;">Попробуйте изменить фильтры</div></div>';
                return;
            }

            content.innerHTML = '<div class="product-grid">' + filtered.map(p => {
                const imageHtml = p.image ? '<img src="' + p.image + '" alt="' + p.name + '" onerror="this.style.display=\'none\'">' : '📦';
                const metaHtml = [
                    p.width ? '<span class="meta-tag">📐 ' + p.width + '</span>' : '',
                    p.texture ? '<span class="meta-tag">✨ ' + p.texture + '</span>' : '',
                    p.color ? '<span class="meta-tag">🎨 ' + p.color + '</span>' : ''
                ].filter(x => x).join('');

                return '<div class="product-card"><div class="product-image">' + imageHtml + '</div><div class="product-info"><div class="product-header"><div class="product-title">' + p.name + '</div><div class="product-code">' + p.code + '</div></div><div class="product-meta">' + metaHtml + '</div><div class="product-prices"><div class="price-main">' + p.price_cut + ' ₽/м²</div>' + (p.price_harpoon && p.price_harpoon !== '—' ? '<div class="price-harpoon">гарпун: ' + p.price_harpoon + ' ₽</div>' : '') + '</div><div class="product-actions"><button class="btn-add" onclick="addToCart(' + p.id + ')">🛒 В смету</button>' + (p.link ? '<a href="' + p.link + '" target="_blank" class="btn-link">↗</a>' : '') + '</div></div></div>';
            }).join('') + '</div>';
        }

        function updateBreadcrumbs() {
            const breadcrumbs = document.getElementById('breadcrumbs');
            let html = '<span class="breadcrumb-item" onclick="resetNavigation()">Все категории</span>';

            if (state.currentCategory) {
                html += '<span class="breadcrumb-separator">→</span>';
                if (state.currentBrand) {
                    html += '<span class="breadcrumb-item" onclick="backToBrands()">' + state.currentCategory + '</span>';
                    html += '<span class="breadcrumb-separator">→</span>';
                    html += '<span class="breadcrumb-current">' + state.currentBrand + '</span>';
                } else {
                    html += '<span class="breadcrumb-current">' + state.currentCategory + '</span>';
                }
            }

            breadcrumbs.innerHTML = html;
        }

        function resetNavigation() {
            state.currentCategory = null;
            state.currentBrand = null;
            document.querySelectorAll('.category-item').forEach(item => item.classList.remove('active'));
            showBrands();
            updateBreadcrumbs();
        }

        function backToBrands() {
            state.currentBrand = null;
            showBrands();
            updateBreadcrumbs();
        }

        function toggleCart() {
            const panel = document.getElementById('estimatePanel');
            const overlay = document.getElementById('overlay');
            panel.classList.toggle('open');
            overlay.classList.toggle('open');
            renderEstimateItems();
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;

            state.cart.push(product);
            document.getElementById('cartBadge').textContent = state.cart.length;

            const notification = document.createElement('div');
            notification.style.cssText = 'position:fixed;top:30px;right:30px;background:linear-gradient(135deg,#4facfe,#00f2fe);color:white;padding:15px 25px;border-radius:12px;box-shadow:0 8px 25px rgba(0,0,0,0.4);z-index:2000;display:flex;align-items:center;gap:12px;';
            notification.innerHTML = '<img src="' + product.image + '" style="width:40px;height:40px;border-radius:6px;object-fit:cover;"><div><div style="font-weight:700;font-size:14px;">Добавлено в смету</div><div style="font-size:12px;opacity:0.9;">' + product.name + '</div></div>';
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.style.animation = 'slideOut 0.3s forwards';
                setTimeout(() => notification.remove(), 300);
            }, 2500);
        }

        function renderEstimateItems() {
            const container = document.getElementById('estimateItems');
            if (state.cart.length === 0) {
                container.innerHTML = '<div style="text-align:center;padding:40px 0;"><div style="font-size:48px;margin-bottom:20px;">📝</div><div style="font-size:16px;font-weight:600;">Смета пуста</div><div style="font-size:13px;color:#b8b8d4;">Добавьте товары из каталога</div></div>';
                document.getElementById('totalPrice').textContent = '0 ₽';
                return;
            }

            let total = 0;
            container.innerHTML = state.cart.map((item, index) => {
                total += item.price_cut;
                return '<div class="estimate-item"><img src="' + item.image + '" alt="' + item.name + '"><div class="estimate-item-details"><div class="estimate-item-title">' + item.name + '</div><div class="estimate-item-price">' + item.price_cut.toLocaleString('ru-RU') + ' ₽/м²</div></div><button class="btn-remove-item" onclick="removeFromCart(' + index + ')">✕</button></div>';
            }).join('');

            document.getElementById('totalPrice').textContent = total.toLocaleString('ru-RU') + ' ₽';
        }

        function removeFromCart(index) {
            state.cart.splice(index, 1);
            document.getElementById('cartBadge').textContent = state.cart.length;
            renderEstimateItems();
        }

        function clearEstimate() {
            if (confirm("Вы действительно хотите полностью очистить смету?")) {
                state.cart = [];
                document.getElementById('cartBadge').textContent = '0';
                renderEstimateItems();
            }
        }

        function exportEstimate() {
            if (state.cart.length === 0) {
                alert("Смета пуста!");
                return;
            }

            let csv = 'Артикул;Товар;Категория;Бренд;Цена (₽)\n';
            state.cart.forEach(item => {
                csv += item.code + ';' + item.name + ';' + item.category + ';' + item.brand + ';' + item.price_cut + '\n';
            });

            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'b2b_smeta_' + new Date().toISOString().slice(0, 10) + '.csv';
            a.click();
            URL.revokeObjectURL(url);
        }

        document.getElementById('searchInput').addEventListener('input', function(e) {
            const query = e.target.value.toLowerCase().trim();
            const content = document.getElementById('contentArea');

            if (query.length < 2) {
                if (state.currentCategory) {
                    showProducts();
                } else {
                    showBrands();
                }
                updateBreadcrumbs();
                return;
            }

            const filtered = products.filter(p => 
                p.name.toLowerCase().includes(query) ||
                p.code.toLowerCase().includes(query) ||
                p.brand.toLowerCase().includes(query)
            );

            if (filtered.length === 0) {
                content.innerHTML = '<div style="text-align:center;padding:80px 20px;"><div style="font-size:80px;margin-bottom:20px;">🔍</div><div style="font-size:24px;font-weight:600;margin-bottom:10px;">Ничего не найдено</div><div style="color:#b8b8d4;font-size:16px;">Попробуйте изменить запрос</div></div>';
                return;
            }

            content.innerHTML = '<div style="margin-bottom:15px;font-size:14px;color:#b8b8d4;">Результаты поиска для: "' + query + '"</div><div class="product-grid">' + filtered.slice(0, 80).map(p => {
                const imageHtml = p.image ? '<img src="' + p.image + '" alt="' + p.name + '" onerror="this.style.display=\'none\'">' : '📦';
                return '<div class="product-card"><div class="product-image">' + imageHtml + '</div><div class="product-info"><div class="product-header"><div class="product-title">' + p.name + '</div><div class="product-code">' + p.code + '</div></div><div class="product-prices"><div class="price-main">' + p.price_cut + ' ₽/м²</div></div><div class="product-actions"><button class="btn-add" onclick="addToCart(' + p.id + ')">🛒 В смету</button></div></div></div>';
            }).join('') + '</div>';

            document.getElementById('breadcrumbs').innerHTML = '<span class="breadcrumb-item" onclick="resetNavigation()">Все категории</span><span class="breadcrumb-separator">→</span><span class="breadcrumb-current">Поиск</span>';
        });

        loadData();
    </script>
</body>
</html>
