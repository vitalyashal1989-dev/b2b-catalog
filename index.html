<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B2B Каталог — Всё-Полотна.рф | Профессиональный каталог</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #667eea;
            --primary-dark: #764ba2;
            --secondary: #f093fb;
            --accent: #f5576c;
            --success: #4facfe;
            --warning: #ffa751;
            --bg-dark: #0f0c29;
            --bg-medium: #302b63;
            --bg-light: #24243e;
            --text-primary: #ffffff;
            --text-secondary: #b8b8d4;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-medium) 50%, var(--bg-light) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Header */
        .header {
            background: rgba(15, 12, 41, 0.8);
            backdrop-filter: blur(10px);
            padding: 20px 30px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--card-border);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .logo-text h1 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-text p {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .search-container {
            flex: 1;
            max-width: 500px;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 12px 20px 12px 45px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 14px;
            transition: all 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.08);
        }

        .search-box::before {
            content: '🔍';
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
        }

        .cart-btn {
            position: relative;
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--accent), var(--warning));
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cart-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(245, 87, 108, 0.4);
        }

        .cart-badge {
            background: white;
            color: var(--accent);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
        }

        /* Main Layout */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px;
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 30px;
        }

        /* Sidebar */
        .sidebar {
            position: sticky;
            top: 100px;
            height: fit-content;
        }

        .nav-section {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .nav-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .category-list {
            list-style: none;
        }

        .category-item {
            padding: 12px 16px;
            margin-bottom: 8px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
        }

        .category-item:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateX(5px);
        }

        .category-item.active {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .category-name {
            font-size: 14px;
            font-weight: 500;
        }

        .category-count {
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
        }

        /* Breadcrumbs */
        .breadcrumbs {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .breadcrumb-item {
            cursor: pointer;
            transition: color 0.3s;
        }

        .breadcrumb-item:hover {
            color: var(--primary);
        }

        .breadcrumb-separator {
            color: var(--text-secondary);
        }

        .breadcrumb-current {
            color: var(--text-primary);
            font-weight: 600;
        }

        /* Content Area */
        .content {
            min-height: 600px;
        }

        /* Brand Grid */
        .brand-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .brand-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 24px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .brand-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            box-shadow: 0 12px 30px rgba(102, 126, 234, 0.3);
        }

        .brand-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 15px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 700;
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .brand-name {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .brand-count {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            box-shadow: 0 12px 30px rgba(102, 126, 234, 0.3);
        }

        .product-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: white;
        }

        .product-info {
            padding: 20px;
        }

        .product-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .product-title {
            font-size: 15px;
            font-weight: 600;
            line-height: 1.4;
            flex: 1;
            margin-right: 10px;
        }

        .product-code {
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
        }

        .product-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }

        .meta-tag {
            background: rgba(255, 255, 255, 0.08);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .product-prices {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 15px;
        }

        .price-main {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--success), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .price-harpoon {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .product-actions {
            display: flex;
            gap: 10px;
        }

        .btn-add {
            flex: 1;
            padding: 10px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-link {
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            color: var(--text-primary);
            text-decoration: none;
            font-size: 13px;
            transition: all 0.3s;
        }

        .btn-link:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
        }

        .empty-icon {
            font-size: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .empty-text {
            color: var(--text-secondary);
            font-size: 16px;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 80px 20px;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid var(--card-border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
            }

            .sidebar {
                position: static;
            }
        }

        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 15px;
            }

            .search-container {
                max-width: 100%;
            }

            .brand-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }

            .product-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon">🏠</div>
                <div class="logo-text">
                    <h1>B2B Каталог</h1>
                    <p>Всё-Полотна.рф — профессиональный каталог</p>
                </div>
            </div>

            <div class="search-container">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Поиск по названию, артикулу, бренду...">
                </div>
            </div>

            <button class="cart-btn" onclick="toggleCart()">
                🛒 Смета
                <span class="cart-badge" id="cartBadge">0</span>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="nav-section">
                <div class="nav-title">Категории</div>
                <ul class="category-list" id="categoryList"></ul>
            </div>
        </aside>

        <!-- Content -->
        <main class="content">
            <!-- Breadcrumbs -->
            <div class="breadcrumbs" id="breadcrumbs">
                <span class="breadcrumb-current">Все категории</span>
            </div>

            <!-- Loading -->
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Загрузка каталога...</p>
            </div>

            <!-- Content will be inserted here -->
            <div id="contentArea"></div>
        </main>
    </div>

    <script>
        // Global state
        let products = [];
        let state = {
            currentCategory: null,
            currentBrand: null,
            cart: []
        };

        // Load data
        async function loadData() {
            try {
                const response = await fetch('catalog_data.json?t=' + Date.now());
                if (!response.ok) throw new Error('Не удалось загрузить каталог');

                products = await response.json();
                document.getElementById('loading').style.display = 'none';
                renderCategories();
                showBrands();
            } catch (error) {
                document.getElementById('loading').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">⚠️</div>
                        <div class="empty-title">Ошибка загрузки</div>
                        <div class="empty-text">${error.message}</div>
                    </div>
                `;
            }
        }

        // Render categories
        function renderCategories() {
            const categories = {};
            products.forEach(p => {
                const cat = p.category;
                categories[cat] = (categories[cat] || 0) + 1;
            });

            const list = document.getElementById('categoryList');
            list.innerHTML = Object.entries(categories)
                .sort((a, b) => b[1] - a[1])
                .map(([cat, count]) => `
                    <li class="category-item" onclick="selectCategory('${cat}')">
                        <span class="category-name">${cat}</span>
                        <span class="category-count">${count}</span>
                    </li>
                `).join('');
        }

        // Select category
        function selectCategory(category) {
            state.currentCategory = category;
            state.currentBrand = null;

            // Update active state
            document.querySelectorAll('.category-item').forEach(item => {
                item.classList.remove('active');
                if (item.querySelector('.category-name').textContent === category) {
                    item.classList.add('active');
                }
            });

            showBrands();
            updateBreadcrumbs();
        }

        // Show brands for current category
        function showBrands() {
            const filtered = state.currentCategory 
                ? products.filter(p => p.category === state.currentCategory)
                : products;

            const brands = {};
            filtered.forEach(p => {
                const brand = p.brand;
                brands[brand] = (brands[brand] || 0) + 1;
            });

            const content = document.getElementById('contentArea');

            if (Object.keys(brands).length === 0) {
                content.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📦</div>
                        <div class="empty-title">Нет товаров</div>
                        <div class="empty-text">В этой категории пока нет товаров</div>
                    </div>
                `;
                return;
            }

            content.innerHTML = `
                <div class="brand-grid">
                    ${Object.entries(brands)
                        .sort((a, b) => b[1] - a[1])
                        .map(([brand, count]) => `
                            <div class="brand-card" onclick="selectBrand('${brand}')">
                                <div class="brand-icon">${brand.charAt(0)}</div>
                                <div class="brand-name">${brand}</div>
                                <div class="brand-count">${count} товаров</div>
                            </div>
                        `).join('')}
                </div>
            `;
        }

        // Select brand
        function selectBrand(brand) {
            state.currentBrand = brand;
            showProducts();
            updateBreadcrumbs();
        }

        // Show products
        function showProducts() {
            let filtered = products;

            if (state.currentCategory) {
                filtered = filtered.filter(p => p.category === state.currentCategory);
            }

            if (state.currentBrand) {
                filtered = filtered.filter(p => p.brand === state.currentBrand);
            }

            const content = document.getElementById('contentArea');

            if (filtered.length === 0) {
                content.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🔍</div>
                        <div class="empty-title">Товары не найдены</div>
                        <div class="empty-text">Попробуйте изменить фильтры</div>
                    </div>
                `;
                return;
            }

            content.innerHTML = `
                <div class="product-grid">
                    ${filtered.map(p => `
                        <div class="product-card">
                            <div class="product-image">
                                ${p.image ? `<img src="${p.image}" alt="${p.name}" style="width:100%;height:100%;object-fit:cover;">` : '📦'}
                            </div>
                            <div class="product-info">
                                <div class="product-header">
                                    <div class="product-title">${p.name}</div>
                                    <div class="product-code">${p.code}</div>
                                </div>
                                <div class="product-meta">
                                    ${p.width ? `<span class="meta-tag">📐 ${p.width}</span>` : ''}
                                    ${p.texture ? `<span class="meta-tag">✨ ${p.texture}</span>` : ''}
                                    ${p.color ? `<span class="meta-tag">🎨 ${p.color}</span>` : ''}
                                </div>
                                <div class="product-prices">
                                    <div class="price-main">${p.price_cut} ₽/м²</div>
                                    ${p.price_harpoon ? `<div class="price-harpoon">гарпун: ${p.price_harpoon} ₽</div>` : ''}
                                </div>
                                <div class="product-actions">
                                    <button class="btn-add" onclick="addToCart(${p.id})">+ В смету</button>
                                    ${p.link ? `<a href="${p.link}" target="_blank" class="btn-link">↗</a>` : ''}
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // Update breadcrumbs
        function updateBreadcrumbs() {
            const breadcrumbs = document.getElementById('breadcrumbs');
            let html = '<span class="breadcrumb-item" onclick="resetNavigation()">Все категории</span>';

            if (state.currentCategory) {
                html += '<span class="breadcrumb-separator">→</span>';
                if (state.currentBrand) {
                    html += `<span class="breadcrumb-item" onclick="backToBrands()">${state.currentCategory}</span>`;
                    html += '<span class="breadcrumb-separator">→</span>';
                    html += `<span class="breadcrumb-current">${state.currentBrand}</span>`;
                } else {
                    html += `<span class="breadcrumb-current">${state.currentCategory}</span>`;
                }
            }

            breadcrumbs.innerHTML = html;
        }

        // Reset navigation
        function resetNavigation() {
            state.currentCategory = null;
            state.currentBrand = null;
            document.querySelectorAll('.category-item').forEach(item => item.classList.remove('active'));
            showBrands();
            updateBreadcrumbs();
        }

        // Back to brands
        function backToBrands() {
            state.currentBrand = null;
            showBrands();
            updateBreadcrumbs();
        }

        // Add to cart
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;

            state.cart.push(product);
            document.getElementById('cartBadge').textContent = state.cart.length;

            // Show notification
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 100px;
                right: 30px;
                background: linear-gradient(135deg, var(--success), var(--primary));
                color: white;
                padding: 15px 25px;
                border-radius: 12px;
                box-shadow: 0 8px 20px rgba(0,0,0,0.3);
                z-index: 1000;
                animation: slideIn 0.3s;
            `;
            notification.textContent = `✓ ${product.name} добавлен в смету`;
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.style.animation = 'slideOut 0.3s';
                setTimeout(() => notification.remove(), 300);
            }, 2000);
        }

        // Toggle cart
        function toggleCart() {
            alert(`В смете: ${state.cart.length} товаров\n\nФункция просмотра сметы будет добавлена в следующей версии.`);
        }

        // Search
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const query = e.target.value.toLowerCase();
            if (query.length < 2) {
                if (state.currentBrand) {
                    showProducts();
                } else {
                    showBrands();
                }
                return;
            }

            const filtered = products.filter(p => 
                p.name.toLowerCase().includes(query) ||
                p.code.toLowerCase().includes(query) ||
                p.brand.toLowerCase().includes(query)
            );

            const content = document.getElementById('contentArea');
            if (filtered.length === 0) {
                content.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🔍</div>
                        <div class="empty-title">Ничего не найдено</div>
                        <div class="empty-text">Попробуйте изменить запрос</div>
                    </div>
                `;
                return;
            }

            content.innerHTML = `
                <div class="product-grid">
                    ${filtered.slice(0, 50).map(p => `
                        <div class="product-card">
                            <div class="product-image">
                                ${p.image ? `<img src="${p.image}" alt="${p.name}" style="width:100%;height:100%;object-fit:cover;">` : '📦'}
                            </div>
                            <div class="product-info">
                                <div class="product-header">
                                    <div class="product-title">${p.name}</div>
                                    <div class="product-code">${p.code}</div>
                                </div>
                                <div class="product-meta">
                                    ${p.width ? `<span class="meta-tag">📐 ${p.width}</span>` : ''}
                                    ${p.texture ? `<span class="meta-tag">✨ ${p.texture}</span>` : ''}
                                </div>
                                <div class="product-prices">
                                    <div class="price-main">${p.price_cut} ₽/м²</div>
                                </div>
                                <div class="product-actions">
                                    <button class="btn-add" onclick="addToCart(${p.id})">+ В смету</button>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        });

        // Animations
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideIn {
                from { transform: translateX(100%); opacity: 0; }
                to { transform: translateX(0); opacity: 1; }
            }
            @keyframes slideOut {
                from { transform: translateX(0); opacity: 1; }
                to { transform: translateX(100%); opacity: 0; }
            }
        `;
        document.head.appendChild(style);

        // Init
        loadData();
    </script>
</body>
